[package]
name = "omawrite-reader"
version = "0.1.0"
description = "Omawrite Reader - Minimalist Markdown Writer, Document Hub & Wireless KOReader Sync"
authors = ["Ka"]
edition = "2021"

[lib]
name = "omawrite_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
ssh2 = "0.9"
epub = "2.1"
epub-builder = "0.7"
pulldown-cmark = "0.12"
dirs = "5.0"
walkdir = "2.5"
base64 = "0.22"
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
